name: Reusable Update Promote Workflow

# Moves a channel pointer to an already-published version.
#
# This is both the staged-rollout promotion step and **the rollback path**. Because the release
# objects are immutable and the pointer is the only mutable thing, rolling back is repointing —
# no rebuild, no re-sign, no republish. That property is the entire reason the registry is
# split this way, and it only holds if rollback is genuinely this cheap.
#
#   applications/<app>/<component>/channels/<channel>/latest  <-  releases/<version>
#
# Typical use in a calling repository:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         version: { required: true, type: string }
#   jobs:
#     rollback:
#       uses: inovacc/workflows/.github/workflows/reusable-update-promote.yml@main
#       with:
#         app-id: ambercapture
#         runtime: tauri
#         version: ${{ inputs.version }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      app-id:
        required: true
        type: string
      component:
        required: false
        type: string
        default: desktop
      channel:
        required: false
        type: string
        default: stable
      version:
        required: true
        type: string
        description: An already-published version. SemVer, no leading v.
      runtime:
        required: true
        type: string
        description: Must match the release object, or clients would be handed a mismatched build.
      timeout-minutes:
        required: false
        type: number
        default: 10
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_UPDATE_KV_ID:
        required: true
    outputs:
      previous-version:
        description: The version the channel pointed at before this run
        value: ${{ jobs.promote.outputs.previous }}

permissions:
  contents: read

jobs:
  promote:
    name: Point ${{ inputs.app-id }}/${{ inputs.channel }} at ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      previous: ${{ steps.current.outputs.version }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Read the current pointer
        id: current
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY="applications/${{ inputs.app-id }}/${{ inputs.component }}/channels/${{ inputs.channel }}/latest"

          # Recorded before the change so the run itself is the audit trail of what was live.
          if OUT=$(npx wrangler kv key get --namespace-id="${{ secrets.CLOUDFLARE_UPDATE_KV_ID }}" --remote "$KEY" 2>/dev/null); then
            CUR=$(printf '%s' "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{console.log("")}})')
          else
            CUR=""
          fi
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          echo "current: ${CUR:-<none>} -> target: ${{ inputs.version }}"

      - name: Fetch the target release object
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY="applications/${{ inputs.app-id }}/${{ inputs.component }}/releases/${{ inputs.version }}"

          # Never point a channel at something that does not exist. A pointer to a missing
          # release makes every client resolve `unknown` and stop updating — a self-inflicted
          # outage that is trivially preventable right here.
          if ! npx wrangler kv key get --namespace-id="${{ secrets.CLOUDFLARE_UPDATE_KV_ID }}" --remote \
                 "$KEY" > release.json 2>/dev/null; then
            echo "::error::release ${{ inputs.version }} is not published ($KEY)"
            exit 1
          fi
          test -s release.json || { echo "::error::release object is empty"; exit 1; }

      - name: Build the pointer
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("release.json", "utf8"));
            const [runtime, version] = process.argv.slice(1);

            if (r.version !== version) {
              console.log(`::error::release object says version ${r.version}, expected ${version}`);
              process.exit(1);
            }
            if (r.runtime && r.runtime !== runtime) {
              console.log(`::error::release runtime ${r.runtime} != requested ${runtime}`);
              process.exit(1);
            }
            if (!r.artifacts || !Object.keys(r.artifacts).length) {
              console.log("::error::release object carries no artifacts");
              process.exit(1);
            }

            // Denormalized, exactly as the publish workflow writes it: one KV read serves a
            // client check, and this whole object is what a single atomic write replaces.
            fs.writeFileSync("pointer.json", JSON.stringify({
              runtime,
              version: r.version,
              release_key: `applications/${r.app_id}/${r.component}/releases/${r.version}`,
              minimum_version: r.minimum_version ?? null,
              mandatory: r.mandatory ?? false,
              action: r.action ?? "notify",
              composition: r.composition ?? [],
              artifacts: r.artifacts,
            }, null, 2) + "\n");

            console.log(`pointer built for ${r.version}, platforms: ${Object.keys(r.artifacts).join(", ")}`);
          ' "${{ inputs.runtime }}" "${{ inputs.version }}"

      - name: Write the pointer
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY="applications/${{ inputs.app-id }}/${{ inputs.component }}/channels/${{ inputs.channel }}/latest"
          npx wrangler kv key put --namespace-id="${{ secrets.CLOUDFLARE_UPDATE_KV_ID }}" --remote \
            "$KEY" --path=pointer.json

      - name: Confirm the pointer moved
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY="applications/${{ inputs.app-id }}/${{ inputs.component }}/channels/${{ inputs.channel }}/latest"

          # Read back. KV is eventually consistent, so this confirms the write landed rather
          # than assuming a zero exit code meant clients will see it.
          OUT=$(npx wrangler kv key get --namespace-id="${{ secrets.CLOUDFLARE_UPDATE_KV_ID }}" --remote "$KEY")
          GOT=$(printf '%s' "$OUT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')

          if [ "$GOT" != "${{ inputs.version }}" ]; then
            echo "::error::read-back says $GOT, expected ${{ inputs.version }}"
            exit 1
          fi
          echo "confirmed: $KEY -> $GOT"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Channel pointer moved"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| channel | \`${{ inputs.app-id }}/${{ inputs.component }}/${{ inputs.channel }}\` |"
            echo "| from | \`${{ steps.current.outputs.version || '—' }}\` |"
            echo "| to | \`${{ inputs.version }}\` |"
            echo
            echo "Clients pick this up at their next check; no rebuild was involved."
          } >> "$GITHUB_STEP_SUMMARY"
